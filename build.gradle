allprojects {
    version=projectVersion

    configurations.all {
        resolutionStrategy {
            // Force Spock Groovy 4.0 compatible version across all projects
            force "org.spockframework:spock-core:2.3-groovy-4.0"
            force "org.spockframework:spock-junit4:2.3-groovy-4.0"
        }
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            // Redirect all org.codehaus.groovy references to org.apache.groovy 4.0.31
            if (details.requested.group == 'org.codehaus.groovy') {
                details.useTarget(group: 'org.apache.groovy', name: details.requested.name, version: '4.0.31')
                details.because('Align all Groovy modules to Apache Groovy 4.0.31')
            }
        }
    }
}