buildscript {
    repositories {
        mavenLocal()
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        maven { url "https://repo.grails.org/grails/core" }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsGradlePluginVersion"
//        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.3.4"
    }
}

group "org.grails.plugins"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"org.apache.grails.gradle.grails-plugin"
apply plugin:"org.apache.grails.gradle.grails-gsp"
//apply plugin:"asset-pipeline"
apply plugin:"maven-publish"

//sourceCompatibility = 1.17
//targetCompatibility = 1.17

repositories {
    mavenLocal()
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://repo.grails.org/grails/core" }
    mavenCentral()
}

java {
    withJavadocJar()
    withSourcesJar()
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

configurations {
    developmentOnly
    testImplementation {
        exclude group: 'ch.qos.logback', module: 'logback-classic'
    }
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    developmentOnly("org.springframework.boot:spring-boot-devtools")
    implementation platform("org.apache.grails:grails-bom:$grailsVersion")
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-interceptors"
    implementation "org.apache.grails:grails-layout"
    implementation "org.apache.grails:grails-cache"
    implementation "org.apache.grails:grails-async"
    implementation "org.apache.grails:grails-scaffolding"
    implementation "org.apache.grails:grails-gsp"
    compileOnly "io.micronaut:micronaut-inject-groovy:3.10.4"
    console "org.apache.grails:grails-console"
    profile "org.apache.grails.profiles:web-plugin"
//    runtime "com.bertramlabs.plugins:asset-pipeline-grails:3.3.4"
    testImplementation("io.micronaut:micronaut-inject-groovy:3.10.4") {
        exclude group: 'org.spockframework'
    }
    testImplementation("org.apache.grails:grails-testing-support-datamapping") {
        exclude group: 'org.spockframework'
    }
    testImplementation "org.mockito:mockito-core"
    testImplementation("org.apache.grails:grails-testing-support-web") {
        exclude group: 'org.spockframework'
    }

    testImplementation platform("org.spockframework:spock-bom:2.3-groovy-4.0")
    testImplementation "org.spockframework:spock-core"
    testImplementation "org.spockframework:spock-junit4"
    //testImplementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Grails plugin dependencies
    implementation 'org.grails.plugins:http-builder-helper:1.1.0'
    implementation('org.codehaus.groovy.modules.http-builder:http-builder:0.7.1') {
        exclude module: "commons-logging"
        exclude module: "groovy"
    }
    implementation project(':ala-auth')
    implementation project(':userdetails-service-client')
    implementation(pac4j.oidc)
    implementation(pac4j.jee)

    // Regular JAR dependencies
    implementation "org.apache.httpcomponents:httpmime:4.5.3"
    implementation "jakarta.validation:jakarta.validation-api"
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:4.0.2"


    testImplementation 'uk.org.lidalia:slf4j-test:1.2.0'

    testImplementation ("io.ratpack:ratpack-core:1.9.0") {
        exclude group: 'io.ratpack', module: 'ratpack-guice'
    }
    testImplementation "io.ratpack:ratpack-test:1.2.0"
    testImplementation ("io.ratpack:ratpack-groovy:1.2.0") {
        exclude group: 'io.ratpack', module: 'ratpack-guice'
    }
    testImplementation "io.ratpack:ratpack-groovy-test:1.2.0"
}

compileGroovy {
    groovyOptions.javaAnnotationProcessing = true
}

tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

compileJava.dependsOn(processResources)

bootRun {
    ignoreExitValue true
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-noverify',
            '-XX:TieredStopAtLevel=1',
            '-Xmx1024m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

tasks.withType(Test) {
    useJUnitPlatform()
}
// enable if you wish to package this plugin as a standalone application
bootJar.enabled = false

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.toString().endsWith('-SNAPSHOT') ? 'snapshots' : 'releases' }"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'ALA WS Plugin'
                description = 'Plugin for invoking ALA web services'
                url = 'https://github.com/AtlasOfLivingAustralia/ala-ws-plugin'
                licenses {
                    license {
                        name = 'MPL-1.1'
                        url = 'https://www.mozilla.org/en-US/MPL/1.1/'
                    }
                }
                developers {
                }
                scm {
                    connection = 'scm:git:git://github.com/AtlasOfLivingAustralia/ala-ws-plugin.git'
                    developerConnection = 'scm:git:ssh://github.com:AtlasOfLivingAustralia/ala-ws-plugin.git'
                    url = 'https://github.com/AtlasOfLivingAustralia/ala-ws-plugin/tree/main'
                }
            }
        }
    }
}
